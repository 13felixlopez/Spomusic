<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sonicGradSplash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="35%" stop-color="#00D2FF"/>
      <stop offset="75%" stop-color="#00F59B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="glowGradSplash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00F59B" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="neonGlowSplash" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#080C0E"/>

  <circle cx="256" cy="256" r="140" fill="url(#glowGradSplash)"/>

  <g filter="url(#neonGlowSplash)">
    <path d="M 330 155 C 330 115, 290 90, 240 90 C 175 90, 140 135, 140 185 C 140 245, 205 270, 270 290 C 335 310, 372 340, 372 395 C 372 455, 315 485, 245 485 C 175 485, 135 445, 135 405" 
          fill="none" 
          stroke="url(#sonicGradSplash)" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <path d="M 325 155 C 325 125, 290 106, 240 106 C 185 106, 156 142, 156 185 C 156 235, 215 258, 275 278 C 340 300, 356 332, 356 395 C 356 440, 310 468, 245 468 C 190 468, 150 435, 150 405" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="10" 
          stroke-linecap="round" 
          opacity="0.85"/>

    <line x1="210" y1="265" x2="210" y2="295" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <line x1="230" y1="250" x2="230" y2="310" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="250" y1="235" x2="250" y2="325" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <line x1="270" y1="245" x2="270" y2="315" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="290" y1="260" x2="290" y2="300" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
